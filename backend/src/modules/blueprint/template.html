<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Blueprint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; line-height: 1.6; }

    .header {
      background: #1A1A2E;
      color: #fff;
      padding: 48px 40px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .header .subtitle {
      font-size: 14px;
      color: #A0A0C0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .identity-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F4F4F8;
      padding: 24px 40px;
      border-bottom: 2px solid #E0E0E8;
    }
    .archetype-label {
      font-size: 22px;
      font-weight: 600;
      color: #1A1A2E;
    }
    .readiness-score {
      font-size: 36px;
      font-weight: 700;
      color: #1A1A2E;
    }
    .readiness-score span {
      font-size: 14px;
      font-weight: 400;
      color: #888;
    }

    .section {
      padding: 32px 40px;
    }
    .section h2 {
      font-size: 18px;
      font-weight: 600;
      color: #1A1A2E;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #E0E0E8;
    }

    .radar-container {
      display: flex;
      justify-content: center;
      padding: 24px 0;
    }

    .strategies-list {
      list-style: none;
    }
    .strategies-list li {
      padding: 16px 0;
      border-bottom: 1px solid #F0F0F4;
    }
    .strategies-list li:last-child {
      border-bottom: none;
    }
    .strategy-name {
      font-size: 16px;
      font-weight: 600;
      color: #1A1A2E;
      margin-bottom: 4px;
    }
    .strategy-description {
      font-size: 14px;
      color: #666;
    }
    .strategy-score {
      display: inline-block;
      background: #1A1A2E;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin-top: 6px;
    }

    .insights-list {
      list-style: none;
    }
    .insights-list li {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: #F8F8FC;
      border-left: 3px solid #1A1A2E;
      border-radius: 0 4px 4px 0;
      font-size: 14px;
    }

    .growth-strategy { page-break-before: always; }
    .growth-paths-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .growth-path-card { padding: 16px; border: 1px solid #E0E0E8; border-radius: 8px; }
    .growth-path-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .growth-path-card p { font-size: 12px; color: #666; }
    .growth-path-card.locked { background: #F8F8FC; opacity: 0.7; }
    .growth-path-card .progress-bar { height: 4px; background: #E0E0E8; border-radius: 2px; margin-top: 8px; }
    .growth-path-card .progress-bar div { height: 100%; background: #D97706; border-radius: 2px; }

    .footer {
      text-align: center;
      padding: 24px 40px;
      font-size: 12px;
      color: #AAA;
      border-top: 1px solid #E0E0E8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="subtitle">InvestorOS</div>
    <h1>Investment Blueprint</h1>
  </div>

  <div class="identity-bar">
    <div class="archetype-label">{{archetype}}</div>
    <div class="readiness-score">{{readinessScore}} <span>/ 100</span></div>
  </div>

  <div class="section">
    <h2>Identity Radar</h2>
    <div class="radar-container">
      {{radarSvg}}
    </div>
  </div>

  <div class="section">
    <h2>Recommended Strategies</h2>
    <ul class="strategies-list">
      {{strategies}}
    </ul>
  </div>

  <div class="section">
    <h2>Key Insights</h2>
    <ul class="insights-list">
      {{insights}}
    </ul>
  </div>

  {{growthStrategy}}

  <div class="footer">
    Generated by InvestorOS &mdash; Your personalized investment identity platform
  </div>
</body>
</html>
